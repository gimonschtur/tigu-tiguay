site_name: Tigu-Tiguay Score Tracker Docs
site_description: Requirements, UI design, and software design for the Tigu-Tiguay trivia score tracker.
repo_url: https://github.com/gimonschtur/tigu-tiguay
repo_name: gimonschtur/tigu-tiguay
edit_uri: edit/develop/docs/
docs_dir: ../docs
site_dir: site

theme:
  name: material
  language: en
  font:
    text: Manrope
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

extra_css:
  - stylesheets/extra.css

# Diagrams use a small custom renderer (javascripts/diagrams.js) instead of
# Material's built-in Mermaid support, so wide diagrams keep a readable size
# on phones: they scroll sideways and open full screen on tap.
extra_javascript:
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js
  - javascripts/diagrams.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: diagram
          format: !!python/name:pymdownx.superfences.fence_div_format

nav:
  - Home: index.md
  - Software design:
      - design/index.md
      - Architecture: design/architecture.md
      - Tech stack: design/tech-stack.md
      - Source code and components: design/source-code.md
      - Data model: design/data-model.md
      - Screens and navigation: design/screens-and-navigation.md
      - Key flows: design/key-flows.md
      - Live scoring in depth: design/live-scoring.md
      - Build, test, and deploy: design/build-test-deploy.md
      - Design decisions: design/decisions.md
  - Requirements:
      - Consolidated (by function): trivia-tracker-requirements-consolidated.md
      - Functional and non-functional: trivia-tracker-function-plan.md
      - UI/UX: trivia-tracker-ux-requirements.md
      - Glossary, thresholds, defaults: trivia-tracker-glossary.md
  - UI design:
      - Design brief: ui_design/trivia-tracker-design-brief.md
      - Design system (Barako Coastal): ui_design/trivia-tracker-design-system.md
